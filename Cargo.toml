[workspace]
resolver = "2"
members = [
    "crates/brain-domain",
    "crates/brain-connectors",
    "crates/connector-linear",
    "crates/brain-storage",
    "crates/brain-storage-postgres",
    "crates/brain-ingestion",
    "crates/brain-compiler",
    "apps/brain-server",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0-alpha.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
async-trait = "=0.1.89"
dotenvy = "=0.15.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
axum = "=0.8.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread"] }

