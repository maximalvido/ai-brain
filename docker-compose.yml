services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_brain}
      POSTGRES_USER: ${POSTGRES_USER:-ai_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_brain_local}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ai-brain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_brain -d ai_brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  http:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_brain}:${POSTGRES_PASSWORD:-ai_brain_local}@postgres:5432/${POSTGRES_DB:-ai_brain}
      BRAIN_API_KEY: ${BRAIN_API_KEY:?BRAIN_API_KEY must be set}
      BRAIN_HTTP_ADDR: 0.0.0.0:8787
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      SLACK_API_TOKEN: ${SLACK_API_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BRAIN_HTTP_BIND:-127.0.0.1}:${BRAIN_HTTP_PORT:-8787}:8787"
    restart: unless-stopped

  linear-sync:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["sync-loop"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_brain}:${POSTGRES_PASSWORD:-ai_brain_local}@postgres:5432/${POSTGRES_DB:-ai_brain}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_SYNC_INTERVAL_SECONDS: ${LINEAR_SYNC_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  slack-sync:
    profiles: ["slack"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["sync-slack-loop"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_brain}:${POSTGRES_PASSWORD:-ai_brain_local}@postgres:5432/${POSTGRES_DB:-ai_brain}
      SLACK_API_TOKEN: ${SLACK_API_TOKEN:-}
      SLACK_CONVERSATION_TYPES: ${SLACK_CONVERSATION_TYPES:-public_channel}
      SLACK_INITIAL_LOOKBACK_SECONDS: ${SLACK_INITIAL_LOOKBACK_SECONDS:-604800}
      SLACK_SYNC_INTERVAL_SECONDS: ${SLACK_SYNC_INTERVAL_SECONDS:-300}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["mcp"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_brain}:${POSTGRES_PASSWORD:-ai_brain_local}@postgres:5432/ai_brain
      BRAIN_API_KEY: ${BRAIN_API_KEY:?BRAIN_API_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    restart: unless-stopped

volumes:
  ai-brain-postgres:
